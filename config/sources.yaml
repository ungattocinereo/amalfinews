# Amalfi Coast News Sources Configuration
# 11 Italian websites for event scraping

sources:
  - id: "amalfinews"
    name: "Amalfi News"
    url: "https://www.amalfinews.it"
    type: "wordpress"
    enabled: true
    priority: 1
    rate_limit: 1.0
    selectors:
      articles: ".post, article"
      title: "h2.entry-title, h1.entry-title, .post-title"
      date: "time.entry-date, .published, .post-date"
      content: ".entry-content, .post-content"
      image: ".wp-post-image, .post-thumbnail img"
      link: "a.entry-title, h2 a, h1 a"
    rss_feed: "https://www.amalfinews.it/feed/"

  - id: "amalfinotizie"
    name: "Amalfi Notizie"
    url: "https://www.amalfinotizie.it"
    type: "wordpress"
    enabled: true
    priority: 1
    rate_limit: 1.0
    selectors:
      articles: ".post, article"
      title: "h2.entry-title, .post-title"
      date: "time.entry-date, .post-date"
      content: ".entry-content"
      image: ".wp-post-image"
      link: "a.entry-title"
    rss_feed: "https://www.amalfinotizie.it/feed/"

  - id: "booble"
    name: "Booble Eventi"
    url: "https://www.booble.it"
    type: "custom"
    enabled: true
    priority: 2
    rate_limit: 0.5
    selectors:
      articles: ".event-card, .evento, .post-event"
      title: "h3.event-title, .evento-title, h2"
      date: "span.event-date, .data-evento"
      content: "div.event-description, .evento-desc"
      image: "img.event-image, .evento-img"
      link: "a.event-link"
    notes: "Custom event platform - may have different structure"

  - id: "ilvescovado"
