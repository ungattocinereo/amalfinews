# Source Categories for Filtering
categories:
  cultural_events:
    - "concerti"
    - "teatro"
    - "mostre"
    - "exhibitions"
    - "spettacoli"

  food_wine:
    - "sagra"
    - "degustazione"
    - "food"
    - "vino"
    - "gastronomia"

  festivals:
    - "festival"
    - "festa"
    - "celebrazione"
    - "processione"

  nature_outdoor:
    - "trekking"
    - "escursione"
    - "mare"
    - "spiaggia"
    - "natura"

  markets:
    - "mercato"
    - "mercatino"
    - "fiera"
    - "artigianato"

# Exclusion Keywords (always filter out)
exclusions:
  political:
    - "elezioni"
    - "consiglio comunale"
    - "giunta"
    - "politica"

  religious_services:
    - "messa"
    - "santa messa"
    - "liturgia"
    - "celebrazione eucaristica"

  administrative:
    - "bando"
    - "concorso pubblico"
    - "ordinanza"
    - "delibera"

  private:
    - "matrimonio privato"
    - "evento privato"
    - "su invito"
